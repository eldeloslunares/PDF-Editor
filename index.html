<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JD PDF Editor</title>
  
  <!-- Etiquetas PWA para iOS y Android -->
  <meta name="theme-color" content="#f8fafd">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="JD PDF">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Roboto:ital,wght@0,300;0,400;0,500;0,700;1,400&family=Inter:wght@400;600&family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  
  <!-- PDF Libraries & OCR -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Header Bar estilo Google Docs / Workspace -->
  <header class="app-header">
    <div class="header-left">
      <!-- Logo JD estilo Google -->
      <div class="brand-logo" title="JD PDF Editor">
        <svg class="jd-logo-svg" viewBox="0 0 100 40" width="90" height="36">
          <path d="M 28 8 L 28 24 C 28 31 23 35 15 35 C 9 35 4 32 2 28 L 7.5 24.5 C 9 27.5 11.5 29.5 15 29.5 C 19.5 29.5 22 27 22 23 L 22 8 Z" fill="#4285F4"/>
          <path d="M 28 8 L 28 17 L 22 17 L 22 8 Z" fill="#EA4335"/>
          <path d="M 2 28 C 4 32 9 35 15 35 L 15 29.5 C 11.5 29.5 9 27.5 7.5 24.5 Z" fill="#FBBC05"/>
          <path d="M 7.5 24.5 C 6.5 22.5 6 20.5 6 18 L 12 18 C 12 19.5 12.3 21 13 22 Z" fill="#34A853"/>
          <path d="M 38 8 L 52 8 C 62 8 70 14 70 21.5 C 70 29 62 35 52 35 L 38 35 Z M 44 14 L 44 29 L 52 29 C 58 29 63.5 25.5 63.5 21.5 C 63.5 17.5 58 14 52 14 Z" fill="#4285F4"/>
          <path d="M 38 8 L 52 8 C 57 8 61 9.5 64 12 L 60 16.5 C 58 14.8 55 14 52 14 L 44 14 L 44 8 Z" fill="#EA4335"/>
          <path d="M 64 12 C 68 15 70 18.5 70 21.5 C 70 24.5 68 28 64 31 L 60 26.5 C 62.5 24.5 63.5 23 63.5 21.5 C 63.5 19.5 62 17.5 60 16.5 Z" fill="#FBBC05"/>
          <path d="M 38 35 L 52 35 C 57 35 61 33.5 64 31 L 60 26.5 C 58 28.2 55 29 52 29 L 44 29 L 44 35 Z" fill="#34A853"/>
        </svg>
      </div>
      <div class="doc-meta">
        <div class="doc-title-row">
          <input type="text" id="documentNameInput" value="Documento sin título" spellcheck="false">
          <span class="save-status" id="saveStatus">Guardado localmente</span>
        </div>
        <div class="menu-bar">
          <button class="menu-text-btn" id="btnOpenPdf">Abrir PDF</button>
          <button class="menu-text-btn" id="btnExportPdf">Descargar PDF</button>
          <button class="menu-text-btn" id="btnDetectNative">Escanear Texto</button>
          <button class="menu-text-btn" id="btnTriggerOcr">OCR Página (Tesseract)</button>
          <button class="menu-text-btn" id="btnSampleDoc">Cargar Muestra</button>
        </div>
      </div>
    </div>

    <div class="header-right">
      <input type="file" id="filePicker" accept="application/pdf" style="display: none;">
      <button class="g-btn-primary" id="btnQuickExport">
        <span class="material-symbols-outlined">download</span>
        <span>Exportar</span>
      </button>
    </div>
  </header>

  <div class="toolbar-container">
    <div class="toolbar-pill">
      <div class="tool-group">
        <button class="tool-btn active" id="toolSelect" title="Seleccionar y Editar Texto (V)"><span class="material-symbols-outlined">arrow_selector_tool</span></button>
        <button class="tool-btn" id="toolNewText" title="Nuevo Cuadro de Texto (T)"><span class="material-symbols-outlined">title</span></button>
      </div>
      <div class="tool-separator"></div>
      <div class="tool-group">
        <select id="fontSelect" class="g-select font-family-select" title="Familia tipográfica">
          <option value="'Roboto', sans-serif">Roboto</option>
          <option value="Arial, sans-serif">Arial</option>
          <option value="'Google Sans', sans-serif">Google Sans</option>
          <option value="'Inter', sans-serif">Inter</option>
          <option value="'Montserrat', sans-serif">Montserrat</option>
          <option value="'Times New Roman', serif">Times New Roman</option>
          <option value="Georgia, serif">Georgia</option>
          <option value="'Courier New', monospace">Courier New</option>
        </select>
        <div class="font-size-stepper">
          <button class="stepper-btn" id="btnFontSizeDec">−</button>
          <input type="number" id="fontSizeInput" value="14" min="6" max="144" title="Tamaño de fuente">
          <button class="stepper-btn" id="btnFontSizeInc">+</button>
        </div>
      </div>
      <div class="tool-separator"></div>
      <div class="tool-group">
        <button class="tool-btn" id="btnFormatBold" title="Negrita (Ctrl+B)"><span class="material-symbols-outlined">format_bold</span></button>
        <button class="tool-btn" id="btnFormatItalic" title="Cursiva (Ctrl+I)"><span class="material-symbols-outlined">format_italic</span></button>
        <button class="tool-btn" id="btnFormatUnderline" title="Subrayado (Ctrl+U)"><span class="material-symbols-outlined">format_underlined</span></button>
        <label class="color-picker-label" title="Color de texto">
          <span class="material-symbols-outlined">format_color_text</span>
          <input type="color" id="textColorPicker" value="#202124">
          <div class="color-indicator" id="textColorIndicator"></div>
        </label>
        <label class="color-picker-label" title="Fondo / Resaltado">
          <span class="material-symbols-outlined">format_color_fill</span>
          <input type="color" id="bgMaskColorPicker" value="#FFFFFF">
          <div class="color-indicator" id="bgColorIndicator" style="background: #ffffff; border: 1px solid #dadce0;"></div>
        </label>
      </div>
      <div class="tool-separator"></div>
      <div class="tool-group">
        <button class="tool-btn active" id="btnAlignLeft" title="Alinear a la izquierda"><span class="material-symbols-outlined">format_align_left</span></button>
        <button class="tool-btn" id="btnAlignCenter" title="Centrar"><span class="material-symbols-outlined">format_align_center</span></button>
        <button class="tool-btn" id="btnAlignRight" title="Alinear a la derecha"><span class="material-symbols-outlined">format_align_right</span></button>
      </div>
      <div class="tool-separator"></div>
      <div class="tool-group">
        <button class="tool-btn" id="btnMaskExisting" title="Cubrir texto original con fondo opaco"><span class="material-symbols-outlined">layers</span></button>
        <button class="tool-btn delete-btn" id="btnDeleteBox" title="Eliminar cuadro de texto (Supr)"><span class="material-symbols-outlined">delete</span></button>
      </div>
      <div class="tool-separator"></div>
      <div class="tool-group zoom-group">
        <button class="tool-btn" id="btnZoomOut" title="Reducir zoom"><span class="material-symbols-outlined">zoom_out</span></button>
        <span id="zoomLevelLabel" class="zoom-text">100%</span>
        <button class="tool-btn" id="btnZoomIn" title="Aumentar zoom"><span class="material-symbols-outlined">zoom_in</span></button>
        <button class="tool-btn" id="btnZoomFit" title="Ajustar ancho"><span class="material-symbols-outlined">fit_screen</span></button>
      </div>
    </div>
  </div>

  <main class="workspace-area">
    <aside class="sidebar-thumbnails" id="sidebarThumbnails">
      <div class="sidebar-header"><span>Páginas</span></div>
      <div class="thumbnails-scroll" id="thumbnailsList"></div>
    </aside>
    <section class="viewport-canvas-container" id="viewportScrollContainer">
      <div class="document-scroller" id="documentPagesScroller">
        <div class="empty-state-card" id="emptyPlaceholder">
          <div class="empty-icon-wrap"><span class="material-symbols-outlined">description</span></div>
          <h2>Abre o arrastra un archivo PDF para comenzar</h2>
          <p>Detecta el texto existente al instante, edítalo o aplica OCR inteligente con Tesseract para reemplazar cualquier contenido.</p>
          <div class="empty-actions">
            <button class="g-btn-primary" id="btnEmptyUpload"><span class="material-symbols-outlined">upload_file</span>Seleccionar PDF</button>
            <button class="g-btn-outlined" id="btnEmptySample">Cargar PDF de ejemplo</button>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div class="google-snackbar" id="appSnackbar">
    <span class="snackbar-msg" id="snackbarText">Mensaje</span>
    <button class="snackbar-dismiss" id="snackbarDismiss">Cerrar</button>
  </div>

  <div class="ocr-progress-modal" id="ocrModal">
    <div class="ocr-modal-content">
      <div class="ocr-spinner"></div>
      <h3 id="ocrModalTitle">Reconociendo texto con Tesseract OCR...</h3>
      <div class="ocr-progress-bar-bg"><div class="ocr-progress-bar-fill" id="ocrProgressFill"></div></div>
      <span class="ocr-status-pct" id="ocrProgressStatus">Iniciando motor de OCR...</span>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
