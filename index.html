<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JD PDF Editor</title>
  
  <!-- PWA Manifest -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">

  <!-- Fuentes e Íconos estilo Apple -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  
  <!-- Estilos -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Fondo dinámico principal -->
  <div class="background-gradient"></div>

  <!-- Barra de Herramientas Flotante (Liquid Glass) -->
  <header class="glass-panel toolbar">
    <div class="toolbar-section">
      <label for="pdf-upload" class="glass-btn primary-btn">
        <i class="ph ph-folder-open"></i> Abrir PDF
      </label>
      <input type="file" id="pdf-upload" accept="application/pdf" style="display: none;">
    </div>

    <div class="toolbar-section">
      <button id="btn-text" class="glass-btn">
        <i class="ph ph-text-t"></i> Texto
      </button>
      <button id="btn-draw" class="glass-btn">
        <i class="ph ph-pencil-simple"></i> Dibujar
      </button>
      <button id="btn-ocr" class="glass-btn">
        <i class="ph ph-scan"></i> OCR Tesseract
      </button>
    </div>

    <div class="toolbar-section">
      <button id="btn-save" class="glass-btn success-btn">
        <i class="ph ph-download-simple"></i> Guardar
      </button>
    </div>
  </header>

  <!-- Contenedor Principal del Documento -->
  <main class="workspace">
    <div class="pdf-canvas-container glass-panel">
      <!-- Aquí tu app.js renderizará el PDF -->
      <canvas id="pdf-render-canvas"></canvas>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
